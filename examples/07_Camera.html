<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MGE example: Camera</title>
    </head>

    <!-- These body properties aim at centering the game canvas in the screen-->
    <body style="min-height: 100%;display: flex;align-items: center;justify-content: center;height: 100vh"> 
        <!-- IMPORT MGE LIBRARY-->
        <script src="mge_V1.4.0.js"></script>

        <!-- GAME-->
        <script>
            // Set the game properties
            mge.game.width = 800
            mge.game.height = 600

            //////////////////////////
            // CAMERA
            //////////////////////////
            // Set the camera postion and zoom
            mge.camera.x = 0
            mge.camera.y = 0
            mge.camera.zoom = 1   

            //////////////////////////
            // SPRITES
            //////////////////////////
            // Background sprite (mountains) - scrollFactor 0.2
            let mountainSprite = mge.game.createSprite()
            mountainSprite.width = 1600
            mountainSprite.height = 1200
            mountainSprite.scaleX = 3
            mountainSprite.scaleY = 3
            mountainSprite.x = 0
            mountainSprite.y = 0
            mountainSprite.scrollFactor = 0.2
            mountainSprite.path2D = new Path2D("M-13 333L123 205L314 421L463 408L548 440L982 218L1046 310L1254 145L1379 411L1455 394L1599 526L1602 1197L4 1200")
            mountainSprite.drawFunction = function (ctx) {
                ctx.fillStyle='LightGray'
                ctx.fill(mountainSprite.path2D)
            }
            // Midground sprite (hills) - scrollFactor 0.5
            let hillSprite = mge.game.createSprite()
            hillSprite.width = 1600
            hillSprite.height = 1200
            hillSprite.scaleX = 2
            hillSprite.scaleY = 2
            hillSprite.x = 0
            hillSprite.y = 200
            hillSprite.scrollFactor = 0.5
            hillSprite.path2D = new Path2D("M0 417Q323 237 370 331Q492 477 670 438Q964 343 1080 503Q1283 673 1418 434Q1512 205 1600 288L1607 1203L-2 1197")
            hillSprite.drawFunction = function (ctx) {
                ctx.fillStyle='DarkGray'
                ctx.fill(hillSprite.path2D)
            }
            // Foreground sprite (platform) - scrollFactor 1
            let platformSprite = mge.game.createSprite()
            platformSprite.width = 200
            platformSprite.height = 50
            platformSprite.scaleX = 1
            platformSprite.scaleY = 1
            platformSprite.x = 0
            platformSprite.y = -100
            platformSprite.scrollFactor = 1
            platformSprite.drawFunction = function (ctx) {
                ctx.fillStyle='DimGray'
                ctx.fillRect(0,0,200,50)
            }
            // Static sprite (target) - scrollFactor 0
            let targetSprite = mge.game.createSprite()
            targetSprite.width = 800
            targetSprite.height = 600
            targetSprite.scaleX = 1
            targetSprite.scaleY = 1
            targetSprite.x = 400
            targetSprite.y = 320
            targetSprite.scrollFactor = 0
            targetSprite.path2D = new Path2D("M115 276A120 120 0 0 1 681 280A35 35 0 0 1 115 275M397 -6L398 559M116 275L680 277")
            targetSprite.drawFunction = function (ctx) {
                ctx.lineWidth = 2
                ctx.strokeStyle='Red'
                ctx.stroke(targetSprite.path2D)
            }
                       
            // Create the main scene
            let mainScene = {
                start:function() {},
                update:function() {
                    if (mge.camera.x < 200) {
                        mge.camera.x+=1
                    } else {
                        if (mge.camera.y < 100) {
                        mge.camera.y+=1
                        } else {
                            if (mge.camera.zoom < 1.5) {
                                mge.camera.zoom += 0.005
                            }
                        }
                    }
                },
                draw: function() {
                    // Draw the sprites
                    mountainSprite.draw()
                    hillSprite.draw()
                    platformSprite.draw()
                    targetSprite.draw()
               }
            }
            // Start the game using the basic scene
            mge.game.start(mainScene)

        </script>
    </body>
</html>
